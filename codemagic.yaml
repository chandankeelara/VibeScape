# Codemagic build config for the VibeScape Flutter app.
#
# Free-tier friendly: produces an UNSIGNED iOS .ipa that you sideload
# to your phone via AltStore on Windows using a free Apple ID.
# No paid Apple Developer account required.
#
# Setup:
#   1. Sign up at https://codemagic.io (GitHub OAuth is fine)
#   2. Connect this repo
#   3. Trigger the `ios-unsigned` workflow manually (or push to main)
#   4. Download the `.ipa` artifact from the build output
#   5. Open AltServer on Windows → drag the .ipa in → AltStore installs it
#
# Free tier: 500 build-minutes/month. A cold Flutter iOS build is ~15 min,
# so you get ~30 iOS builds/month free.

workflows:

  # ---------------------------------------------------------------------------
  # iOS — unsigned, free-tier flow. Output: mobile/build/ios/ipa/*.ipa
  # ---------------------------------------------------------------------------
  ios-unsigned:
    name: iOS (unsigned, sideload via AltStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.vibescape.app"
    scripts:
      - name: Bootstrap Flutter deps
        script: |
          cd mobile
          flutter --version
          flutter pub get
      - name: Generate freezed / json_serializable
        script: |
          cd mobile
          dart run build_runner build --delete-conflicting-outputs
      - name: Fill in native iOS shell
        script: |
          cd mobile
          flutter create --org com.vibescape --project-name vibescape --platforms=ios .
      - name: Precache Flutter iOS engine
        script: |
          cd mobile
          flutter precache --ios
      - name: Install CocoaPods
        script: |
          cd mobile/ios
          pod install --repo-update
      # `flutter build ios --no-codesign` still requires a Development Team
      # on the Xcode project. Bypass by calling xcodebuild directly with
      # every signing setting explicitly disabled — produces an unsigned
      # `.app` we then zip into an .ipa for AltStore sideloading.
      - name: Build unsigned Runner.app via xcodebuild
        script: |
          cd mobile/ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios-derived \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            FLUTTER_BUILD_MODE=release \
            DART_DEFINES="$(echo -n 'VIBESCAPE_ENV=prod' | base64)" \
            clean build
      - name: Package Runner.app as unsigned .ipa
        script: |
          cd mobile
          APP_PATH=$(find build/ios-derived/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found — xcodebuild step must have failed"
            find build/ios-derived -name "*.app" | head -5
            exit 1
          fi
          mkdir -p build/ios/ipa Payload
          cp -R "$APP_PATH" Payload/
          zip -qr build/ios/ipa/vibescape-unsigned.ipa Payload
          ls -la build/ios/ipa/
    artifacts:
      - mobile/build/ios/ipa/*.ipa

  # ---------------------------------------------------------------------------
  # Android — APK for direct install on an Android phone. No signing config
  # needed; produces a debug APK. Sideload via `adb install` or share the file.
  # ---------------------------------------------------------------------------
  android-debug:
    name: Android (debug APK)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Bootstrap Flutter deps
        script: |
          cd mobile
          flutter --version
          flutter pub get
      - name: Generate freezed / json_serializable
        script: |
          cd mobile
          dart run build_runner build --delete-conflicting-outputs
      - name: Fill in native Android shell
        script: |
          cd mobile
          flutter create --org com.vibescape --project-name vibescape --platforms=android .
      - name: Build debug APK
        script: |
          cd mobile
          flutter build apk --debug --dart-define=VIBESCAPE_ENV=prod
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk

    <script type="application/ld+json">

    "@context": "https://schema.org",

    <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How does VibeScape sort music by mood?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Every track in your library is scored for energy using a fine-tuned audio-ML model. That score places it in one of five mood buckets — sleep, chill, steady, hype, or beast — which become one-tap filters. You can also drag a vibe slider to blend between them."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need a Spotify Premium account?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. VibeScape works with a free Spotify account for library import, and plays previews or YouTube videos of your tracks. Spotify Premium unlocks in-app streaming of full songs via the Spotify Web Playback SDK."
        }
      },
      {
        "@type": "Question",
        "name": "Can I try VibeScape without signing up?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Click Just listen on the landing page to enter a shared demo library instantly, no account required. When you're ready, sign in with Spotify to import your own music — your Spotify account IS your VibeScape identity, no separate password or PIN."
        }
      },
      {
        "@type": "Question",
        "name": "Is VibeScape free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, VibeScape is free and open source. There are no ads, no paid tiers, and no data sold. Source code lives on GitHub."
        }
      },
      {
        "@type": "Question",
        "name": "Does it work on my phone?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. The mobile layout uses your album art as a full-viewport backdrop, a slide-up queue sheet, and native Bluetooth transport controls via the Media Session API so play, pause, and skip work from your headphones or car."
        }
      },
      {
        "@type": "Question",
        "name": "What languages does VibeScape support?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The library is language-agnostic. VibeScape uses Whisper to detect the sung language of each track — including Indian, Punjabi, Tamil, and other regional catalogs that western music APIs often miss — and labels them in the player. Instrumentals are left untagged rather than guessed."
        }
      }
    ]
  }
  </script>

    <!-- Spotify Web Playback SDK. Assigns
         window.onSpotifyWebPlaybackSDKReady, which src/media/spotify.js
         defines at module scope before this finishes loading. -->
    <script src="https://sdk.scdn.co/spotify-player.js" async defer></script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registered after load so it never competes with the app bundle.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
